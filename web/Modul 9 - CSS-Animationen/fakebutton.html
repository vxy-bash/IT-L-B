<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klickme</title>
</head>

<style>
    h1 {
        text-align: center;
        margin-top: 450px;
    }

    button{
        width: 250px;
        height: 100px;
        background-color: rgb(14, 202, 14);
        color: rgb(0, 0, 0);
        border: solid black;
        border-radius: 5px;
        
        
    }

    div {
        top: 60%;
        left: 50%;
        translate: -50% -50%;
        position: absolute;
    }

    button:hover {
        animation: trans 5s ease-in-out forwards; 
        animation-delay: 60ms;
    }

    @keyframes trans {
        0% {
            transform: translate(0px, 0px);
        }

        100% {
            transform: translate(0px, 300px);
           
        }
    }

    img{
        width :250px;
        height :100px;        
    }

</style>

<body>
    <header>
        <h1>Willkommen auf der Seite!</h1>
    </header>
<div><a href="https://www.bfi-kaernten.at/"><img src="Bilder/bfi.webp" alt=""></a></div>
    <div>
        <button>Klick me</button>
    </div>
</body>

</html>
