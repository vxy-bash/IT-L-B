<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
</head>

<style>
    div {
        width: 100px;
        height: 100px;
        border-radius: 50px;
        background-color: lightgray;
        position: relative;
        animation: farbwechsel 10s infinite;
        animation-delay: 3s;
    }

    @keyframes farbwechsel {
        0% {
            background-color: lightgray;
            left: 0px;
            top: 0px;
            border-radius: 50px;
        }

        25% {
            background-color: red;
            left: 250px;
            top: 0px;
            border-radius: 38px;
        }

        50% {
            background-color: green;
            left: 250px;
            top: 250px;
            border-radius: 25px;
        }

        75% {
            background-color: black;
            left: 0px;
            top: 250px;
            border-radius: 13px;
        }

        100% {
            background-color: gold;
            left: 0px;
            top: 0px;
            border-radius: 0px;
        }
    }
</style>


<body>
    <div></div>
</body>

</html>
