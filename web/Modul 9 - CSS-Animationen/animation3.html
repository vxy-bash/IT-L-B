<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
</head>

<style>
    h1 {
        background-color: lightblue;
        width: 200px;
        height: 50px;
        transition: scale 5s;
        position: absolute;
        left: 200px;
        top: 200px;
        animation: trans 20s infinite;

    }

    h1:hover {
        Rotate: 0 1 1 45deg;
    }

    @keyframes trans {
        25% {
            transform: translate(400px, 0px);
        }

        50% {
            transform: translate(400px, 400px);
        }

        75% {
            transform: translate(0px, 400px);
        }

        100% {
            transform: translate(0px, 0px);
        }
    }
</style>


<body>
    <h1>Hallo Welt!</h1>
</body>

</html>
