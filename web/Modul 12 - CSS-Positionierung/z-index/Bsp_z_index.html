<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beispiel für die Verwendung von z-index</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Platzierung mit "z-index"</h1>
    </header>
    <div>
    <p>Dies ist ein Fließtext innerhalb eines Absatz-Elementes. <img src="testbauer-blk60px.png"> In diesem Absatz ist ein Bild - ein Inline-Element eingefügt, das nun absolut platziert wird. <span>Ein span-Element, innerhalb des Absatzes, dass als Inline auch ein Bild hat  <img src="turm-blk60px.png"></span></p>
    </div>
</body>
</html>
